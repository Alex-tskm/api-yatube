$kind: http-request
name: create_comment // No Auth
url: http://127.0.0.1:8000/api/v1/posts/{{post_with_group}}/comments/
method: POST
body:
  type: json
  content: |-
    {
        "text": "Комментарий незарегистрированного пользователя"
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("Статус-код ответа должен быть 401", function () {
          pm.expect(
              pm.response.status,
              "Незарегистрированный пользователь не должен иметь возможности создать комментарии"
          ).to.be.eql("Unauthorized");
      });
    language: text/javascript
order: 1000
