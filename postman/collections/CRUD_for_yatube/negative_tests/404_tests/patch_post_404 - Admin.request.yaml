$kind: http-request
name: patch_post_404 // Admin
url: http://127.0.0.1:8000/api/v1/posts/99999/
method: PATCH
body:
  type: json
  content: |-
    {
        "text": "Новый текст для несуществующего поста"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Статус-код ответа должен быть 404", function () {
          pm.expect(
              pm.response.status,
              "Если в запросе к `/api/v1/posts/{post_id}/` указан id несуществующего поста, код ответа должен быть 404"
          ).to.be.eql("Not Found");
      });
    language: text/javascript
order: 3000
