[mypy]
python_version = 3.11
plugins = django_stubs.ext.mypy_plugin,djangorestframework_stubs.plugin.MyPyPlugin
django_settings_module = yatube_api.settings

warn_return_any = True
disallow_untyped_defs = True

# Не игнорируем импорты: заглушки дают точные типы вместо заглушек-пустышек
[mypy-django.*]
ignore_missing_imports = False
follow_imports = normal

[mypy-rest_framework.*]
ignore_missing_imports = False
follow_imports = normal
